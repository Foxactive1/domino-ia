name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (sintaxe + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe
        run: |
          node --check jogo.js
          node --check online.js
      - name: Testes (lógica local, IA e cliente online)
        run: node --test tests/*.cjs

  python:
    name: Python (testes + rede real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install 'python-socketio[client]'
      - name: Testes do servidor
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Teste de rede (Gunicorn real, WebSocket e polling)
        run: python tests/network_smoke.py
